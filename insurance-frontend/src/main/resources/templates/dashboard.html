<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commercial Fleet Insurance Shield</title>
    <!-- Include responsive Bootstrap CSS layout framework -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .card-active { border-left: 6px solid #198754; }
        .card-expired { border-left: 6px solid #dc3545; }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container">
        <header class="pb-3 mb-5 border-bottom">
            <h1 class="display-5 fw-bold text-dark">🚚 Fleet Insurance Hub</h1>
            <p class="text-muted fs-5">Active Compliance Monitoring Engine</p>
        </header>

        <!-- Main Grid Framework listing all clients -->
        <div class="row g-4">
            <div class="col-md-6" th:each="owner : ${owners}">
                <!-- Dynamic Card border swapping based on backend policy state -->
                <div class="card shadow-sm h-100" 
                     th:classappend="${owner.insurancePolicy.status == 'ACTIVE' ? 'card-active' : 'card-expired'}">
                    
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="h4 card-title mb-0 fw-bold" th:text="${owner.name}">Owner Name</h3>
                            <!-- Compliance Badging -->
                            <span class="badge rounded-pill fs-6" 
                                  th:classappend="${owner.insurancePolicy.status == 'ACTIVE' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${owner.insurancePolicy.status}">STATUS</span>
                        </div>
                        
                        <p class="text-muted mb-2">📧 <span th:text="${owner.email}">email@test.com</span></p>
                        <p class="text-muted mb-4">📞 <span th:text="${owner.phoneNumber}">555-0000</span></p>

                        <!-- Policy Info Panel -->
                        <div class="bg-light p-3 rounded mb-4 border">
                            <div class="row text-center">
                                <div class="col-6 border-end">
                                    <small class="text-uppercase text-muted d-block fw-semibold" style="font-size: 0.75rem;">Contract Number</small>
                                    <strong th:text="${owner.insurancePolicy.policyNumber}">POL-000</strong>
                                </div>
                                <div class="col-6">
                                    <small class="text-uppercase text-muted d-block fw-semibold" style="font-size: 0.75rem;">Monthly Premium</small>
                                    <strong class="text-primary" th:text="${'$' + #numbers.formatDecimal(owner.insurancePolicy.premiumAmount, 1, 2)}">$0.00</strong>
                                </div>
                            </div>
                        </div>

                        <!-- Active Asset Sub-list -->
                        <h5 class="h6 fw-bold mb-3 text-secondary text-uppercase" style="letter-spacing: 0.5px;">Covered Asset Fleet</h5>
                        <ul class="list-group list-group-flush rounded border mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center bg-white" th:each="truck : ${owner.trucks}">
                                <div>
                                    <strong th:text="${truck.model}">2023 Volvo</strong>
                                    <small class="text-muted d-block" style="font-size: 0.8rem;">VIN: <span th:text="${truck.vin}">VIN123</span></small>
                                </div>
                                <span class="badge bg-secondary font-monospace" th:text="${truck.licensePlate}">ABC-123</span>
                            </li>
                        </ul>

                        <!-- Button Triggering Asset Addition Form -->
                        <div class="d-grid">
                            <button class="btn btn-outline-primary fw-semibold btn-sm" 
                                    data-bs-toggle="modal" 
                                    th:data-bs-target="${'#addTruckModal-' + owner.id}">
                                ➕ Append Fleet Asset
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Modal Form Pop-up for appending trucks -->
                <div class="modal fade" th:id="${'addTruckModal-' + owner.id}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content shadow">
                            <div class="modal-header bg-dark text-white">
                                <h5 class="modal-title fw-bold">Add Truck to <span th:text="${owner.name}">Client</span></h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form action="/add-truck" method="POST">
                                <div class="modal-body p-4">
                                    <input type="hidden" name="ownerId" th:value="${owner.id}">
                                    
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold text-secondary">Vehicle Model Name</label>
                                        <input type="text" name="modelName" class="form-control form-control-lg" placeholder="e.g. 2025 Kenworth T680" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold text-secondary">Unique VIN String</label>
                                        <input type="text" name="vin" class="form-control form-control-lg text-uppercase" placeholder="17-Digit Vehicle Identification Number" required>
                                    </div>
                                    <div class="mb-0">
                                        <label class="form-label fw-semibold text-secondary">License Plate Code</label>
                                        <input type="text" name="licensePlate" class="form-control form-control-lg text-uppercase" placeholder="State Plate Reference" required>
                                    </div>
                                </div>
                                <div class="modal-footer bg-light p-3">
                                    <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary fw-semibold px-4">Register Asset & Re-Rate</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Include Bootstrap JS bundle for seamless form modal execution -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
